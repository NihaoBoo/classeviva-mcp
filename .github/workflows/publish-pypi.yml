name: Publish to PyPI

on:
  # Manual trigger while the PyPI Trusted Publisher is being configured.
  # Once the publisher is registered, switch to:
  #   release:
  #     types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for Trusted Publishing (OIDC): the workflow gets a short-lived
  # token from PyPI without any long-lived API token stored in GitHub.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/classeviva-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Build the package
        run: uv build --out-dir dist

      - name: Verify the metadata
        run: uv run python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
