[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "classeviva-mcp"
version = "1.1.3"
description = "Server MCP (Model Context Protocol) per il registro elettronico Spaggiari ClasseViva e Google Classroom iCal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
authors = [{ name = "classeviva-mcp contributors" }]
keywords = ["mcp", "classeviva", "spaggiari", "scuola", "google-classroom", "model-context-protocol"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "keyring>=25.0.0",
    "icalendar>=5.0.13",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
classeviva-mcp = "classeviva_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/NihaoBoo/classeviva-mcp"
Repository = "https://github.com/NihaoBoo/classeviva-mcp"
Issues = "https://github.com/NihaoBoo/classeviva-mcp/issues"
Changelog = "https://github.com/NihaoBoo/classeviva-mcp/blob/main/CHANGELOG.md"
Security = "https://github.com/NihaoBoo/classeviva-mcp/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/classeviva_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "data", "attachments", "classeviva-mcp"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["tests/"]

[tool.coverage.run]
source = ["src/classeviva_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 55
