[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "classeviva-mcp"
version = "0.1.0"
description = "Server MCP (Model Context Protocol) per il registro elettronico Spaggiari ClasseViva e Google Classroom iCal"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "keyring>=25.0.0",
    "icalendar>=5.0.13",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
classeviva-mcp = "classeviva_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/classeviva_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
